name: Hustle beta quality gates

on:
  pull_request:
    branches:
      - main
      - codex/release-stabilization-integration-20261030
      - codex/fix-worker-preview-20261031
      - codex/patch-next-security-20261031
      - codex/stabilize-auth-flows-20261031
      - codex/linkup-brand-20261031
      - codex/stabilize-db-ci-20261030
      - codex/stabilize-migration-history-20261030
      - feature/interactive-functional-v6
      - fix/auth-portfolio-security-20261020
      - feature/v43-premium-editorial-polish-20261025
      - feature/v44-navigation-chat-notifications-20261025
      - feature/v45-editorial-premium-marketplace-20261025
  push:
    branches:
      - feature/preview-smart-search-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and security tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Runtime build
        run: npm run build
      - name: Static Cloudflare preview build
        run: npm run build:preview

  messenger-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:preview
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25-messenger-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
